[project]
name = "lca-reliable-agents"
version = "0.1.0"
description = "LangChain Academy: Building Reliable Agents (con soporte completo para Ollama Local y OpenAI)"
readme = "README.md"
requires-python = ">=3.12, <=3.13"
dependencies = [
    "anthropic>=0.34.0",
    "httpx>=0.27.0",
    "ipykernel>=6.29.0",
    "langchain>=0.2.16",
    "langchain-community>=0.2.16",
    "langchain-core>=0.2.38",
    "langchain-ollama>=0.1.3",
    "langsmith>=0.1.120",
    "langsmith-fetch>=0.3.1",
    "numpy>=1.26.0",
    "ollama>=0.3.3",
    "openai>=1.45.0",
    "pandas>=2.2.0",
    "pydantic>=2.8.0",
    "python-dotenv>=1.0.1",
    "rich>=13.8.0",
    "tiktoken>=0.7.0",
]

[tool.uv]
package = false
